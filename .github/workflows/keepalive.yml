name: MonkeyCode Keepalive

on:
  schedule:
    # 白天高峰期（北京时间 08:00–18:00）：每 8 分钟一次
    - cron: '*/8 0-10 * * *'
    # 夜间低谷期（北京时间 18:00–次日 08:00）：每 30 分钟一次
    - cron: '*/30 11-23 * * *'
  workflow_dispatch:   # 保留手动触发按钮，方便随时测试

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install websockets --quiet

      - name: Run Heartbeat Script
        env:
          TASK_ID: ${{ secrets.MONKEY_TASK_ID }}
          MONKEY_COOKIE: ${{ secrets.MONKEY_COOKIE }}
        run: |
          python - <<'PY'
          import asyncio, os, json, sys
          import websockets

          TASK_ID = os.environ.get("TASK_ID")
          COOKIE = os.environ.get("MONKEY_COOKIE")

          if not TASK_ID or not COOKIE:
              print("❌ 错误: 缺少 TASK_ID 或 MONKEY_COOKIE 环境变量。")
              sys.exit(1)

          URL = f"wss://monkeycode-ai.com/api/v1/users/tasks/control?id={TASK_ID}"
          PAYLOAD = {"type": "ping", "data": None, "kind": "", "timestamp": 0}

          # 构造完整请求头，绕过 HTTP 400 拦截
          HEADERS = {
              "Cookie": COOKIE,
              "Origin": "https://monkeycode-ai.com",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
              "Pragma": "no-cache",
              "Cache-Control": "no-cache"
          }

          async def heartbeat():
              try:
                  print(f"🔗 正在连接 WebSocket: {URL}")
                  
                  # 自动兼容不同版本的 websockets 库参数
                  try:
                      ws_connect = websockets.connect(URL, additional_headers=HEADERS, open_timeout=15)
                  except TypeError:
                      ws_connect = websockets.connect(URL, extra_headers=HEADERS, open_timeout=15)

                  async with ws_connect as ws:
                      print("✅ WebSocket 连接成功，开始发送心跳！")
                      for i in range(6):
                          await ws.send(json.dumps(PAYLOAD))
                          print(f"📡 第 {i+1}/6 次 ping 发送成功")
                          await asyncio.sleep(10)
                  print("🎉 本轮保活执行完毕，正常退出。")
              except websockets.exceptions.InvalidStatus as e:
                  print(f"❌ 连接被拒绝 (状态码错误): {e}")
                  print("👉 原因大概率是 Cookie 过期了，请重新获取 Cookie 并更新 MONKEY_COOKIE。")
                  sys.exit(1)
              except Exception as e:
                  print(f"❌ 发生未知异常: {e}")
                  sys.exit(1)

          asyncio.run(heartbeat())
          PY