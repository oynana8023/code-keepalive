name: MonkeyCode Real Keepalive & Wakeup

on:
  schedule:
    # 白天高频（北京时间 08:00–18:00）：每 8 分钟一次
    - cron: '*/8 0-10 * * *'
    # 夜间低频（北京时间 18:00–次日 08:00）：每 30 分钟一次
    - cron: '*/30 10-23 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: pip install requests websockets --quiet

      - name: Check Status and Wakeup
        env:
          TASK_ID: ${{ secrets.MONKEY_TASK_ID }}
          MONKEY_COOKIE: ${{ secrets.MONKEY_COOKIE }}
        run: |
          python - <<'PY'
          import os, sys, time, json, asyncio
          import requests
          import websockets

          TASK_ID = os.environ.get("TASK_ID")
          COOKIE = os.environ.get("MONKEY_COOKIE")
          CLEAN_ID = TASK_ID.replace("task-", "")

          HEADERS = {
              "Cookie": COOKIE,
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Referer": f"https://monkeycode-ai.com/console/task/{TASK_ID}"
          }

          STATUS_URL = f"https://monkeycode-ai.com/api/v1/users/tasks/{TASK_ID}"
          # 【关键】：如果发现休眠，调用启动 API (根据常见规范盲猜的启动接口，如果不准会打印出来)
          START_URL = f"https://monkeycode-ai.com/api/v1/users/tasks/{TASK_ID}/start"
          
          def check_and_wake():
              print(f"🔍 1. 正在检查任务 {CLEAN_ID} 状态...")
              try:
                  res = requests.get(STATUS_URL, headers=HEADERS, timeout=10)
                  if res.status_code == 200:
                      data = res.json().get("data", {})
                      status = data.get("status", "unknown")
                      print(f"👉 当前环境状态: {status}")

                      # 如果状态不是 running 或者 processing，说明睡死了
                      if status not in ["running", "processing", "starting"]:
                          print(f"⚠️ 发现环境休眠({status})，正在尝试发送启动指令...")
                          # 尝试发送 POST 启动请求
                          start_res = requests.post(START_URL, headers=HEADERS, timeout=10)
                          print(f"🚀 启动请求返回: {start_res.status_code}")
                          if start_res.status_code == 200:
                              print("✅ 启动指令发送成功，等待 15 秒环境初始化...")
                              time.sleep(15)
                      else:
                          print("✅ 环境处于活跃状态，准备发送心跳。")
                  else:
                      print(f"❌ 检查状态失败，HTTP {res.status_code}")
              except Exception as e:
                  print(f"⚠️ 检查状态发生异常: {e}")

          async def send_ws_heartbeat():
              URL = f"wss://monkeycode-ai.com/api/v1/users/tasks/control?id={CLEAN_ID}"
              PAYLOAD = {"type": "ping", "data": None, "kind": "", "timestamp": 0}
              print(f"🔗 2. 正在建立 WebSocket 心跳连接...")
              try:
                  try:
                      ws_connect = websockets.connect(URL, additional_headers=HEADERS, open_timeout=10)
                  except TypeError:
                      ws_connect = websockets.connect(URL, extra_headers=HEADERS, open_timeout=10)

                  async with ws_connect as ws:
                      for i in range(6):
                          await ws.send(json.dumps(PAYLOAD))
                          print(f"📡 第 {i+1}/6 次 ping 发送成功")
                          await asyncio.sleep(10)
                  print("🎉 本次真实保活执行完毕。")
              except Exception as e:
                  print(f"❌ WebSocket 连接失败: {e}")

          # 执行流程
          check_and_wake()
          asyncio.run(send_ws_heartbeat())
          PY