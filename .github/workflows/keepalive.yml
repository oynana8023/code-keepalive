name: MonkeyCode Keepalive

on:
  schedule:
    # 低频触发，防止被 GitHub 判定为滥用：只在白天（北京时间 08:00–18:00）每小时整点跑一次
    - cron: '0 0-10 * * *'
  workflow_dispatch:   # 保留手动触发按钮，方便你随时测试

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 允许单次任务最长运行 60 分钟
    
    steps:
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests websockets --quiet

      - name: 执行长跑保活任务
        env:
          TASK_ID: ${{ secrets.MONKEY_TASK_ID }}
          MONKEY_COOKIE: ${{ secrets.MONKEY_COOKIE }}
        run: |
          python - <<'PY'
          import os, sys, time, json, asyncio
          import requests
          import websockets

          TASK_ID = os.environ.get("TASK_ID")
          COOKIE = os.environ.get("MONKEY_COOKIE")

          if not TASK_ID or not COOKIE:
              print("❌ 错误: 缺少 TASK_ID 或 MONKEY_COOKIE。")
              sys.exit(1)

          # 兼容处理：去除可能存在的 task- 前缀
          CLEAN_ID = TASK_ID.replace("task-", "")

          HEADERS = {
              "Cookie": COOKIE,
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Referer": f"https://monkeycode-ai.com/console/task/{TASK_ID}"
          }

          def check_and_wake():
              print(f"🔍 正在检查任务 {CLEAN_ID} 状态...")
              try:
                  res = requests.get(f"https://monkeycode-ai.com/api/v1/users/tasks/{TASK_ID}", headers=HEADERS, timeout=10)
                  if res.status_code == 200:
                      status = res.json().get("data", {}).get("status", "unknown")
                      print(f"👉 当前状态: {status}")
                      # 如果环境处于休眠/停止状态，发 POST 请求强制唤醒
                      if status not in ["running", "processing", "starting"]:
                          print(f"⚠️ 发现环境休眠({status})，正在发送启动指令...")
                          start_res = requests.post(f"https://monkeycode-ai.com/api/v1/users/tasks/{TASK_ID}/start", headers=HEADERS, timeout=10)
                          print(f"🚀 唤醒指令已发送 (状态码: {start_res.status_code})")
                          time.sleep(15) # 等待服务器初始化
                  elif res.status_code == 401:
                      print("❌ 401 错误：Cookie 过期！请更新 MONKEY_COOKIE。")
              except Exception as e:
                  print(f"⚠️ 检查状态异常: {e}")

          async def ws_heartbeat():
              URL = f"wss://monkeycode-ai.com/api/v1/users/tasks/control?id={CLEAN_ID}"
              PAYLOAD = {"type": "ping", "data": None, "kind": "", "timestamp": 0}
              try:
                  # 兼容不同 websockets 版本
                  try:
                      ws_connect = websockets.connect(URL, additional_headers=HEADERS, open_timeout=10)
                  except TypeError:
                      ws_connect = websockets.connect(URL, extra_headers=HEADERS, open_timeout=10)
                  
                  async with ws_connect as ws:
                      await ws.send(json.dumps(PAYLOAD))
                      print("📡 WebSocket Ping 发送成功")
              except Exception as e:
                  print(f"❌ WebSocket 连接异常: {e}")

          # --- 核心循环逻辑 ---
          print("🚀 开启长跑保活模式（每 8 分钟心跳一次，持续 55 分钟）...")
          start_time = time.time()
          MAX_RUNTIME = 3300  # 运行 55 分钟（3300秒），留 5 分钟给 GitHub 调度
          
          while time.time() - start_time < MAX_RUNTIME:
              check_and_wake()
              asyncio.run(ws_heartbeat())
              
              print(f"⏳ 已运行 {int(time.time() - start_time)} 秒，等待 8 分钟后进行下一次心跳...")
              time.sleep(480) # 等待 8 分钟（480秒）
              
          print("🎉 本小时保活任务圆满结束，等待下个整点自动触发。")
          PY